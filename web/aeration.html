<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioTreat 曝气调节</title><link rel="stylesheet" href="/assets/app.css"></head>
<body><header><div class="brand">BioTreat 工艺联控</div><nav><a href="/process">工艺总控</a><a aria-current="page" href="/aeration">曝气调节</a><a href="/sludge">污泥回流</a><a href="/alarms">异常处置</a></nav></header>
<main><div class="page-head"><div><h1>曝气稳定窗口</h1><div class="muted">结合批次阶段、最近溶氧样本与风机状态进行限频决策</div></div><div class="status"><span class="dot"></span><span id="health">checking</span></div></div>
<div class="grid">
  <section class="panel wide"><h2>风机频率决策</h2><div class="rows" id="aeration"></div></section>
  <section class="panel"><h2>提交溶氧批次</h2><form id="sample"><label>处理线<select name="line"><option>line-1</option><option>line-2</option><option>line-3</option></select></label><label>生化池<input name="basin" value="basin-line-1"></label><label>最近采样<input name="values" value="2.0,2.1,2.2,2.1,2.0"></label><button>刷新稳定窗口</button></form></section>
  <section class="panel wide"><h2>每线策略配置</h2><form id="config"><label>处理线<select name="line"><option>line-1</option><option>line-2</option><option>line-3</option></select></label><label>DO 下限<input name="min_do" type="number" step="0.1" min="0.1" value="2.0"></label><label>DO 上限<input name="max_do" type="number" step="0.1" min="0.1" value="3.5"></label><label>安全频率 Hz<input name="safe_frequency" type="number" step="1" min="0" max="60" value="36"></label><label>最大步长 Hz<input name="max_step_hz" type="number" step="0.5" min="0.5" max="60" value="6"></label><label>样本有效期<input name="sample_max_age" value="2m0s"></label><button>保存策略</button></form></section>
  <section class="panel wide"><h2>控制结果</h2><pre id="output">等待采样</pre></section>
</div></main>
<script src="/assets/common.js"></script><script>
const ACTION_TEXT={hold:'保持频率',raise:'提高频率',lower:'降低频率',activate:'安全启动',suspend:'停止供气',throttled:'暂缓调节'};
async function load(){
  const d=await request('/api/aeration');
  const byLine={};(d.decisions||[]).forEach(x=>byLine[x.line_id]=x);
  const policyByLine={};(d.policies||[]).forEach(x=>policyByLine[x.line_id]=x);
  document.querySelector('#aeration').innerHTML=d.blowers.map(b=>{
    const line=b.basin_id.replace(/^basin-/,'');
    const dec=byLine[line], pol=policyByLine[line];
    const band=dec?`${dec.min_do.toFixed(1)}~${dec.max_do.toFixed(1)}`:(pol?`${pol.min_do.toFixed(1)}~${pol.max_do.toFixed(1)}`:'默认 2.0~3.5');
    const doText=dec&&dec.dissolved_oxygen!=null?`${dec.dissolved_oxygen.toFixed(2)} mg/L`:(dec?'无有效样本':'尚未决策');
    const doAge=dec&&dec.sample_observed_at?` <span class="muted">${new Date(dec.sample_observed_at).toLocaleTimeString()}</span>`:'';
    const action=dec?`<strong>${ACTION_TEXT[dec.action]||dec.action}</strong> → ${dec.target_frequency.toFixed(1)} Hz`:`${(b.frequency||0).toFixed(1)} Hz`;
    const reason=dec?`<div class="muted">${dec.reason}</div>`:'<div class="muted">提交溶氧批次后生成首次决策</div>';
    return `<div class="row"><span>${b.id} · ${b.basin_id} · 阶段 ${dec?dec.stage:'-'} · DO ${doText}${doAge}<br>目标范围 ${band} mg/L · 最大步长 ${dec?dec.max_step_hz.toFixed(1):(pol?pol.max_step_hz.toFixed(1):'6.0')} Hz · 风机${b.running?'运行中':'停止'}</span><span>${action}${reason}</span></div>`;
  }).join('');
}
document.querySelector('#sample').addEventListener('submit',async e=>{
  e.preventDefault();const f=new FormData(e.target);
  const values=String(f.get('values')).split(',').map(Number);
  try{show(await request(`/api/aeration/${f.get('line')}/${f.get('basin')}/samples`,{method:'POST',body:JSON.stringify(values)}));load()}catch(err){showError(err)}
});
document.querySelector('#config').addEventListener('submit',async e=>{
  e.preventDefault();const f=new FormData(e.target);
  const body={min_do:Number(f.get('min_do')),max_do:Number(f.get('max_do')),safe_frequency:Number(f.get('safe_frequency')),max_step_hz:Number(f.get('max_step_hz')),sample_max_age:f.get('sample_max_age')};
  try{show(await request(`/api/aeration/${f.get('line')}/config`,{method:'POST',body:JSON.stringify(body)}));load()}catch(err){showError(err)}
});
load().catch(showError);
</script></body></html>
